# Built-in defaults. ./cross-examine.toml, or config.toml in the user config directory,
# overrides any value here, table by table.

rounds = 2  # the round limit, 1–3

# The model each agent runs on. The advocate and the adversary run on the same model by
# default; edit either table to run them on different models, or different providers.
# A [models.<agent>.request] table is merged into that agent's request body,
# e.g. thinking = { type = "disabled" }.
[models.advocate]
provider = "deepseek"
model = "deepseek-flash"
max_tokens = 32768

[models.adversary]
provider = "deepseek"
model = "deepseek-flash"
max_tokens = 32768

[models.judge]  # used only by `eval`
provider = "deepseek"
model = "deepseek-flash"
max_tokens = 32768

[providers.deepseek]
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"  # CI fallback, read only when no key file exists

[analyzers]
stub_max_len = 2
uncovered_min_words = 4
