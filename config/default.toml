# Built-in defaults. ./sedcontra.toml, or config.toml in the user config directory,
# overrides any value here, table by table.

rounds = 1  # the round limit, 1–10; every MCP call runs under it, and run --rounds overrides it for one run
retries = 2  # how often a turn the checks refuse is sent back with its failures, 0–5

# The model each agent runs on, and how deeply it reasons. The advocate and the adversary
# run on the same model, and the advocate reasons at low depth while the adversary reasons at
# high depth; edit either agent's tables to change that.
# [models.<agent>.request] is merged into that agent's request body, so it holds the
# provider's own parameters. For DeepSeek, depth is reasoning_effort = "low", "high" or "max",
# and thinking = { type = "disabled" } turns reasoning off. Reasoning counts against max_tokens;
# a reply cut off there is told to decide at once, and only a second cut-off fails the run.
[models.advocate]
provider = "deepseek"
model = "deepseek-flash"
max_tokens = 32768

[models.advocate.request]
reasoning_effort = "low"

[models.adversary]
provider = "deepseek"
model = "deepseek-flash"
max_tokens = 32768

[models.adversary.request]
reasoning_effort = "high"

[models.judge]  # used only by `eval`
provider = "deepseek"
model = "deepseek-flash"
max_tokens = 32768

[models.judge.request]
reasoning_effort = "high"

[providers.deepseek]
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"  # CI fallback, read only when no key file exists

[analyzers]
stub_max_len = 2
uncovered_min_words = 4

# Word lists for the checks in SPEC.md, "The checks"; matching ignores case and takes whole words,
# so the lists follow the language of the proposal. circular_share flags a premise holding at least
# that share of its conclusion's content words, the words not in stopwords.
[checks]
connectives = ["because", "therefore", "hence", "thus", "consequently"]
qualifiers = ["not", "no", "never", "none", "nothing", "cannot", "can't", "don't", "doesn't", "isn't", "aren't", "won't", "may", "might", "can", "could", "must", "should", "seem", "seems", "appear", "appears", "suggest", "suggests", "perhaps", "probably", "possibly", "likely", "all", "every", "some", "most", "many", "few", "only", "always", "often", "usually", "generally"]
circular_share = 0.8
stopwords = ["a", "an", "the", "of", "to", "in", "on", "for", "and", "or", "but", "nor", "is", "are", "was", "were", "be", "been", "being", "it", "its", "this", "that", "these", "those", "as", "at", "by", "with", "from", "into", "onto", "upon", "about", "which", "who", "whom", "whose", "what", "when", "where", "how", "than", "then", "there", "their", "they", "them", "he", "she", "his", "her", "we", "our", "you", "your", "i", "me", "my", "if", "so", "do", "does", "did", "has", "have", "had", "will", "would", "shall", "should", "can", "could", "may", "might", "must", "not", "no", "also", "both", "either", "neither", "such", "only", "very", "same", "own", "one", "ones", "other", "others", "any", "all", "some", "more", "most", "much", "many", "each", "every"]
